name: Telegram Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ?????????? ??????
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python telegram_schedule.py

      - name: ????????? ????????? ??????
        if: always()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add posted_ids.txt
          if ! git diff --staged --quiet; then
            git commit -m "bot: save scheduled post state [skip ci]"
            git pull --rebase
            git push
          fi

      - name: YouTube ???????
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python youtube_to_telegram.py

      - name: ????????? ????????? ?????
        if: always()
        run: |
          git add last_video_id.txt
          if ! git diff --staged --quiet; then
            git commit -m "bot: save YouTube state [skip ci]"
            git pull --rebase
            git push
          fi
